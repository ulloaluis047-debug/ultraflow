name: Build Windows VST3 and Setup

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64
      - name: Build VST3 and Standalone
        run: cmake --build build --config Release --target UCGInfinity16X_VST3 UCGInfinity16X_Standalone --parallel 2
      - name: Locate products
        shell: pwsh
        run: |
          $vst = Get-ChildItem build -Recurse -Directory -Filter "UCG Infinity 16X.vst3" | Select-Object -First 1
          $exe = Get-ChildItem build -Recurse -File -Filter "UCG Infinity 16X.exe" | Select-Object -First 1
          if (-not $vst) { throw "VST3 output not found" }
          if (-not $exe) { throw "Standalone output not found" }
          New-Item -ItemType Directory -Force dist\payload | Out-Null
          Copy-Item $vst.FullName dist\payload\"UCG Infinity 16X.vst3" -Recurse
          Copy-Item $exe.FullName dist\payload\"UCG Infinity 16X.exe"
      - name: Build installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\UCG-Infinity-16X.iss
      - name: Upload ready installer
        uses: actions/upload-artifact@v4
        with:
          name: UCG-Infinity-16X-Windows-Setup
          path: dist/UCG-Infinity-16X-Setup.exe
          if-no-files-found: error
          retention-days: 30
      - name: Upload raw VST3
        uses: actions/upload-artifact@v4
        with:
          name: UCG-Infinity-16X-VST3
          path: dist/payload/UCG Infinity 16X.vst3
          if-no-files-found: error
          retention-days: 30
